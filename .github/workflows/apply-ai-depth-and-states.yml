name: Apply AI Depth and States

on:
  push:
    paths:
      - '.github/workflows/apply-ai-depth-and-states.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply AI depth and state polish
        run: python .github/scripts/apply-ai-depth-and-states.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Production build check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key-for-build
        run: npm run build
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/v2/V2LiveClientStage2.js app/v2/v2-ai-live.module.css app/v2/v2-extra.module.css
          git commit -m 'Polish AI depth and loading states'
          git push origin main
