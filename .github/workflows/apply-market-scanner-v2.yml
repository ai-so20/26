name: Apply Market Scanner V2
on:
  push:
    paths:
      - '.github/workflows/apply-market-scanner-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scanner patch
        run: python3 .github/scripts/apply_market_scanner_v2.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Production build check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_dummy
        run: npm run build
      - name: Commit scanner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/v2/V2LiveClientStage2.js app/v2/v2-ai-live.module.css
          git rm .github/scripts/apply_market_scanner_v2.py .github/workflows/apply-market-scanner-v2.yml
          git commit -m "Build stateful AI market scanner"
          git push origin HEAD:main
