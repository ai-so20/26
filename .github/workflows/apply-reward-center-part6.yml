name: Apply Reward Center Part 6

on:
  push:
    paths:
      - .github/workflows/apply-reward-center-part6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply patch
        run: python3 .github/scripts/apply_reward_center_part6.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Production build check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_dummy
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/scripts/apply_reward_center_part6.py .github/workflows/apply-reward-center-part6.yml
          git commit -m "Rebuild product reward center experience"
          git push origin HEAD:main
