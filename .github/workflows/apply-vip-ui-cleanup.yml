name: Apply VIP UI cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-vip-ui-cleanup.yml"

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply duplicate-copy cleanup
        run: node .github/scripts/apply-vip-ui-cleanup.cjs

      - name: Verify diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJkdW1teSJ9.signature"
        run: npm run build

      - name: Commit verified cleanup
        run: |
          rm -f .github/workflows/apply-vip-ui-cleanup.yml
          rm -f .github/scripts/apply-vip-ui-cleanup.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove duplicate VIP UI copy without changing functionality"
          git push origin HEAD:main

# one-time verified cleanup retry
