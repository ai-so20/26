name: Apply V2 UI fixes

on:
  push:
    paths:
      - .github/workflows/apply-ui-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply UI fixes
        run: python3 .github/scripts/apply_ui_fixes.py
      - name: Normalize generated files
        run: |
          sed -i 's/[[:space:]]\+$//' app/v2/V2LiveClientStage2.js app/v2/V2CompatibilityLayer.js app/v2/reward/RewardLiveClient.js app/v2/admin/AdminLiveClient.js app/v2/v2.module.css app/v2/v2-live.module.css app/v2/v2-ai-live.module.css
          sed -i '/html, body { max-width: 100%; overflow-x: hidden; }/d' app/v2/v2.module.css
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Production build check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_dummy
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/v2
          git commit -m "Fix mobile UI and restore AI process detail"
          git push origin HEAD:main
