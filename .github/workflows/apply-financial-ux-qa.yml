name: Apply Financial UX QA

on:
  push:
    paths:
      - '.github/workflows/apply-financial-ux-qa.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply focused AI idle label fix
        run: python .github/scripts/apply-ai-idle-label-fix.py
      - name: Verify diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Production build check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_dummy
          SUPABASE_SECRET_KEY: sb_secret_build_dummy
          TWELVE_DATA_API_KEY: build_dummy
        run: npm run build
      - name: Commit focused fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/v2/V2LiveClientStage2.js app/v2/v2-ai-live.module.css
          git commit -m 'Fix AI idle label and return range' || exit 0
          git push origin main

# focused AI idle label fix
