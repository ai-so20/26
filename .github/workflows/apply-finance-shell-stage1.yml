name: Apply finance shell stage 1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-finance-shell-stage1.yml"

permissions:
  contents: write

jobs:
  apply-stage1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply finance shell stage 1
        run: node .github/scripts/apply-finance-shell-stage1.cjs

      - name: Verify diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJkdW1teSJ9.signature"
        run: npm run build

      - name: Commit verified stage 1
        run: |
          rm -f .github/workflows/apply-finance-shell-stage1.yml
          rm -f .github/scripts/apply-finance-shell-stage1.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild VIP shell with finance-style header and navigation"
          git push origin HEAD:main
