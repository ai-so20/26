<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 프로세스 · 내 계정</title><link rel="stylesheet" href="/assets/theme.css"></head><body><main class="page"><header class="top"><span class="brand">AI 프로세스</span><button class="btn" id="btnLogout">로그아웃</button></header><section class="panel process-panel"><h1>AI PROCESS</h1><p id="processState" class="sub" aria-live="polite">진행 상태 확인 중</p><div class="process-percent" id="processPercent" aria-live="polite">0%</div><div class="process-track" role="progressbar" aria-label="AI PROCESS 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="processBar"><div class="process-fill" id="processFill"></div></div><p id="processNotice" class="sub"></p></section><section class="panel"><h1>내 계정</h1><p class="sub">회원 정보를 확인하고 관리할 수 있습니다.</p><div class="row-line"><span>성함</span><strong id="name">-</strong></div><div class="row-line"><span>아이디</span><strong id="username">-</strong></div><div class="row-line"><span>연락처</span><strong id="phone">-</strong></div><div class="row-line"><span>승인 상태</span><strong id="approved">-</strong></div></section><section class="panel"><h2>계정 설정</h2><form id="settings"><div class="field"><label for="editPhone">연락처</label><input id="editPhone" name="phone" maxlength="40" placeholder="선택 입력"></div><div class="field"><label for="editPw">새 비밀번호</label><input id="editPw" name="password" type="password" minlength="4" maxlength="72" placeholder="변경할 경우에만 입력"></div><button class="btn primary">저장</button><p id="notice" class="notice" aria-live="polite"></p></form></section></main><script src="/assets/member-dashboard.js"></script><script src="/assets/process-progress.js"></script></body></html>
